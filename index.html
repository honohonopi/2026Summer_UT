<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>team D</title>
    <meta
      name="description"
      content="LiT Camp 2026 メンバーの Gemini Canvas サイトを集約したショーケース。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="glow glow-left" aria-hidden="true"></div>
    <div class="glow glow-right" aria-hidden="true"></div>

    <main class="page-shell">
      <section class="hero-grid">
        <div class="hero-copy">
          <h1><span>team</span><strong>D</strong></h1>
        </div>

        <div class="hero-stage" aria-hidden="true">
          <img src="./fv-sticker-13.svg" alt="" class="fv-sticker fv-sticker-13" aria-hidden="true" />
          <img src="./fv-sticker-14.svg" alt="" class="fv-sticker fv-sticker-14" aria-hidden="true" />
          <img src="./fv-sticker-16.svg" alt="" class="fv-sticker fv-sticker-16" aria-hidden="true" />
          <img src="./fv-sticker-17.svg" alt="" class="fv-sticker fv-sticker-17" aria-hidden="true" />
          <img src="./fv-sticker-18.svg" alt="" class="fv-sticker fv-sticker-18" aria-hidden="true" />
          <img src="./fv-sticker-19.svg" alt="" class="fv-sticker fv-sticker-19" aria-hidden="true" />
          <img src="./fv-sticker-20.svg" alt="" class="fv-sticker fv-sticker-20" aria-hidden="true" />
        </div>
      </section>

      <section class="section-intro">
        <div>
          <h2>Canvas Lineup</h2>
        </div>
      </section>

      <section class="update-panel" id="update">
        <div class="update-panel-head">
          <p class="update-title">MY LINK</p>
          <a
            class="update-sheet-link"
            href="https://docs.google.com/spreadsheets/d/1VqFrjrXuGtHOBU8Eym29aKhHqNTgLpVenNryhJ2nNC0/edit?gid=0#gid=0"
            target="_blank"
            rel="noreferrer"
          >
            SHEET
          </a>
        </div>
        <form class="update-form" id="member-update-form">
          <label class="update-field">
            <span>NAME</span>
            <select id="member-name-select" name="member"></select>
          </label>
          <label class="update-field update-field-wide">
            <span>URL</span>
            <input
              id="member-url-input"
              name="url"
              type="url"
              inputmode="url"
              placeholder="https://..."
              autocomplete="off"
            />
          </label>
          <button class="update-submit" type="submit">APPLY</button>
        </form>
      </section>

      <section id="members" class="member-grid" aria-live="polite"></section>
    </main>

    <template id="member-card-template">
      <article class="member-card">
        <div class="member-top">
          <div class="member-heading">
            <span class="member-color-tag"></span>
            <p class="member-name"></p>
          </div>
        </div>

        <div class="member-visual">
          <img class="member-avatar-image" alt="" />
          <img class="member-shirt-image" alt="" />
        </div>

        <a class="member-link" target="_blank" rel="noreferrer">
          <span>OPEN</span>
        </a>
      </article>
    </template>

    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
