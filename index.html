<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teamD</title>
    <meta
      name="description"
      content="LiT Camp 2026 メンバーの Gemini Canvas サイトを集約したショーケース。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="glow glow-left" aria-hidden="true"></div>
    <div class="glow glow-right" aria-hidden="true"></div>

    <main class="page-shell">
      <section class="hero-grid">
        <div class="hero-copy">
          <p class="hero-team">teamD</p>
          <h1>
            <span class="hero-title-primary">ダークネスドラゴンユニコーンウルトラマックスver16</span>
            <span class="hero-title-secondary">おかきトッピング味噌汁サラダ付き</span>
          </h1>
        </div>

        <div class="hero-stage" aria-hidden="true">
          <img src="./hero-decor-12.png" alt="" class="hero-decor hero-decor-12" />
          <img src="./hero-decor-13.png" alt="" class="hero-decor hero-decor-13" />
          <img src="./hero-decor-14.png" alt="" class="hero-decor hero-decor-14" />
          <img src="./hero-decor-15.png" alt="" class="hero-decor hero-decor-15" />
          <img src="./hero-decor-16.png" alt="" class="hero-decor hero-decor-16" />
          <img src="./hero-decor-18.png" alt="" class="hero-decor hero-decor-18" />
          <img src="./hero-decor-19.png" alt="" class="hero-decor hero-decor-19" />
          <img src="./hero-decor-20.png" alt="" class="hero-decor hero-decor-20" />
        </div>
      </section>

      <div class="content-shell">
        <section class="update-panel" id="update">
          <div class="update-panel-head">
            <p class="update-title">EDIT LINK</p>
          </div>
          <form class="update-form" id="member-update-form">
            <label class="update-field">
              <span>NAME</span>
              <select id="member-name-select" name="member"></select>
            </label>
            <label class="update-field update-field-wide">
              <span>URL</span>
              <input
                id="member-url-input"
                name="url"
                type="url"
                inputmode="url"
                placeholder="https://..."
                autocomplete="off"
              />
            </label>
            <button class="update-submit" type="submit">APPLY</button>
          </form>
        </section>

        <section id="members" class="member-grid" aria-live="polite"></section>
      </div>
    </main>

    <template id="member-card-template">
      <article class="member-card">
        <div class="member-top">
          <div class="member-heading">
            <span class="member-color-tag"></span>
            <p class="member-name"></p>
          </div>
        </div>

        <div class="member-visual">
          <img class="member-avatar-image" alt="" />
        </div>

        <a class="member-link" target="_blank" rel="noreferrer">
          <span>OPEN</span>
        </a>
      </article>
    </template>

    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
